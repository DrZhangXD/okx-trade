[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "okx-trade"
version = "0.1.0"
description = "Async OKX API client (REST + WebSocket) for crypto quant trading"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zhangxudong" }]
keywords = ["okx", "crypto", "trading", "async", "websocket"]
# 注：NT 1.226 的 nautilus_pyo3.pyi 用了 ``type X = ...`` 语句（PEP 695），
# 要 Python 3.12+。3.10/3.11 上 import 会 SyntaxError，云机器装错版本会炸。
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
]

[project.optional-dependencies]
# Phase 2 策略 / 回测 / 风控层（NautilusTrader + 数值栈）
# 安装：pip install -e ".[strategy]"
strategy = [
  "nautilus_trader>=1.225",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyarrow>=17.0",
  "pyyaml>=6.0",        # M4: configs/*.yaml + scripts/live.py
  "plotly>=5.20",       # backtest equity curve HTML
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "freezegun>=1.4",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/zhangxudong/okx-trade"

[tool.hatch.build.targets.wheel]
packages = ["src/okx_trade"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # flake8-bugbear
  "UP",            # pyupgrade
  "N",             # pep8-naming
  "RUF",
]
ignore = [
  "E501",                    # line length handled by formatter
  "RUF001", "RUF002", "RUF003",  # Chinese punctuation in strings/docstrings/comments is fine
  "RUF022",                  # __all__ sort: 我们按"分组语义"排序，比字母序更易读
  "N818",                    # 异常类名不强制 Error 后缀（与 scalp 项目保持一致）
]

[tool.ruff.lint.isort]
known-first-party = ["okx_trade"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-ra",
  "--strict-markers",
  "-m", "not integration",
]
markers = [
  "integration: tests that require live OKX demo credentials and network access",
]

[tool.coverage.run]
source = ["src/okx_trade"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
