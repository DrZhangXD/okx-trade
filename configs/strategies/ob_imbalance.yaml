# OB Imbalance (M5)：订单流 microprice + book imbalance 微观结构反转
# 实现：src/okx_trade/strategies/ob_imbalance.py
#
# 中频版本：每秒聚合 books5 snapshot，30s 滚动平均 imbalance，命中阈值入场，
# 目标持仓 30s–5min，单笔风险 0.3%。

instrument_id: BTC-USDT-SWAP.OKX
bar_type: BTC-USDT-SWAP.OKX-1-MINUTE-LAST-EXTERNAL

# 信号（M6+.Y 2026-05-27：M6+.X 修复后 7d 仍持续小亏 -$82/123 笔，
# 胜率 84% → 28-38%，alpha 不足覆盖 round-trip fee；进一步收紧 + 提 R:R）
aggregation_sec: 1          # 每秒聚合一次决策
imbalance_window_sec: 30    # 30s 滚动平均
imbalance_threshold: 0.55   # M6+.Y：0.45→0.55 进一步收紧，只接受更强信号
microprice_premium_bps: 5.0 # M6+.X：3→5 收紧（保持）
depth: 5

# 出场（M6+.Y：tp_rr 1.5→2.0 让赢家更大，弥补低胜率）
hold_max_sec: 300           # 超过 5min 强平
stop_distance_bps: 30.0     # M6+.X：8→30bp，BTC 上 ~ $24 stop distance（保持）
tp_rr_ratio: 2.0            # M6+.Y：1.5→2.0；TP = 60bp，赢家需覆盖更多输家

# Reentry gate（M6+.X 防 5/18 同方向连扫死亡螺旋）
reentry_cooldown_sec: 60          # 平仓后 60s 内不能再入场
reentry_requires_reversal: true   # 平仓后 imbalance 必须穿过 0 反转才能再入场

# 仓位（M6+.Y：0.2% → 0.15% 继续压低，验证期再缩仓）
risk_pct: 0.0015
account_equity_usdt: 10000.0

# 实盘默认开 WS；回测/单测时设 false 改用手动喂帧
subscribe_books5: true

# 风控
risk:
  enable_drawdown: true
  enable_vol_target: false
  enable_kelly: true
  kelly_win_rate: 0.55
  kelly_avg_r: 1.5
  kelly_fraction: 0.25
  enable_correlation: false
  # regime gate：声明为 reversal 类
  enable_regime_gate: true
  regime_strategy_kind: reversal
