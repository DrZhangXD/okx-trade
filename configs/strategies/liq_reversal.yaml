# Liq Reversal（M4，新增）
# 实现：src/okx_trade/strategies/liq_reversal.py

instrument_id: BTC-USDT-SWAP.OKX
bar_type: BTC-USDT-SWAP.OKX-1-MINUTE-LAST-EXTERNAL

liq_window_sec: 60             # 当前强平窗口
liq_history_sec: 86400         # 24h 滚动 z-score
zscore_threshold: 3.5          # 3.5σ 才触发(2026-05-16 调:3.0 → 3.5,过滤噪声)
cooldown_sec: 900              # 触发后 15 分钟冷却(2026-05-16 调:300 → 900,避免连 SL)

entry_stop_distance_pct: 0.005 # 0.5% 止损
entry_tp_rr_ratio: 3.0         # 3R 止盈(2026-05-16 调:2.0 → 3.0,盈亏平衡线从 33% 拉到 25%)

# 2026-05-31 止血:0.005 → 0.0025 减半。复盘发现执行滑点把 3R 实测压成 ~1.2R
# (TP 市价回撤只吃 53%、SL 穿价 134%)+ 逆势 falling-knife 偏向,结构性 -2.4/笔
# (4 天 -34 USDT)。减半把出血砍半,保留 paper 观察;正经修复(真实 bracket/algo
# 单 + 趋势否决)见 docs/superpowers/plans/2026-05-31-liq-reversal-execution-fix.md。
# 2026-06-09 再减半:0.0025 → 0.00125。仍是 7 天 -32 的 #2 失血源(执行修复未落地)。
risk_pct: 0.00125
account_equity_usdt: 10000.0
buffer_size: 50000             # 24h 高峰期足够

subscribe_liquidations: true   # 实盘 / paper：true；NT backtest：false（脚本里覆盖）

risk:
  enable_drawdown: true
  drawdown_daily_pct: 0.03
  drawdown_weekly_pct: 0.08
  # M5.X regime gate：liq_reversal 是 reversal 类，震荡市加满、趋势市砍 60%
  enable_regime_gate: true
  regime_strategy_kind: reversal
