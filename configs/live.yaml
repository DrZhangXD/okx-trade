# 4 策略并行 paper trading 配置（M5）
# 由 scripts/live.py 加载

account:
  equity_usdt: 10000.0
  paper_trading: true       # true = NT backtest emulator + 模拟成交；false = 实盘

# PnL tracker 持久化文件
pnl_db: var/pnl.sqlite

# universe 选股（XS Momentum 用）
xs_momentum_universe:
  size: 30                  # top N
  settle_ccy: USDT          # 只看 USDT-settled 永续
  sort_by: vol24h           # 按 24h 成交额排

strategies:
  funding_carry:
    enabled: true
    config: configs/strategies/funding_carry.yaml
  xs_momentum:
    enabled: true
    config: configs/strategies/xs_momentum.yaml
  liq_reversal:
    enabled: true
    config: configs/strategies/liq_reversal.yaml
  # M5 新策略（2026-05-18 paper trading 上线）：
  # - basis_arb：当前 BTC basis ~3.77% APR < 12% 入场阈值，启动后默认 hold；
  #   到期日临近时 basis 收敛接近 0，需要每季度手动更新 futures_instrument_id 的
  #   YYMMDD 后缀到下一个当季合约（260626 → 260925 → 261225 ...）。
  # - ob_imbalance：订阅 books5 WS，秒级聚合，30s 滚动 imbalance；信号触发后
  #   target 30s–5min 持仓，单笔 risk_pct=0.3%。
  basis_arb:
    # 2026-05-19 修复后重启：execution.resolve_td_mode 加 FUTURES 分支
    # （3 段 + 末段全 6 位数字识别为 FUTURES，td_mode=cross，发 posSide）。
    # OKX paper posMode 已确认为 long_short_mode，跟 yaml 对齐。
    #
    # 2026-05-20 update: 早先用 balChg sum (-$7,340) 误判为大亏，差点 disable。
    # OKX 真实 realized + fee = +$734（盈利！）。balChg 大负是因为还持有 BTC
    # spot 仓（$8k 价值在 totalEq 的非 USDT collateral 里）。5/19 sub_type=6
    # futures 短仓强平事件存在但实际只亏 ~$23（很小），不是 -$7,297。保留 enabled。
    # 仍然 roadmap todo #8：futures 端独立强平是真实风险，长期需做 margin 隔离。
    enabled: true
    config: configs/strategies/basis_arb.yaml
  ob_imbalance:
    # 2026-05-19 修复后重启（5/18 死亡螺旋后第一天）：
    # - SL 8bp → 30bp（让 alpha 覆盖 10bp round-trip fee）
    # - 加 reentry_cooldown_sec=60 + reentry_requires_reversal=true
    # - risk_pct 0.3% → 0.2%
    # - pnl_hook.realized_pnl_and_r 现扣 round-trip fee (default 5bps×2 legs)
    # 5/18 真实事件（OKX bills, scripts/strategy_truth_dashboard.py 实证）：
    # - **15,944 笔 BTC-USDT-SWAP fills 一天内**
    # - 真实 balChg -$8,429 USDT（其中 fees -$6,682，realized -$1,748）
    # - 账户从 80,878 跌到 72,356（-10.5%）；avail_eq 一度跌到 63,799
    # - 修复后 5/19 → 389 fills -$106, 5/20 → 45 fills -$1.00（生效）
    # 警示：原叙事曾经反复（"21% 跌"→"3099 假"→"-754 实"→实际 -$8,429）—
    # phantom trades + pagination cap + equity_provider 三层失真叠加。
    enabled: true
    config: configs/strategies/ob_imbalance.yaml
  factor_portfolio:
    # 2026-05-19 paper-trading enable. 5 approved factors (configs/factor_portfolio.yaml):
    #   basis_z_30d (0.40), basis_apr (0.30), momentum_1d_reversal (0.20),
    #   funding_z_30d (0.10), funding_current (0.05).
    # Cold-start warmup timeline (all from-scratch on VPS restart):
    #   t=+1h      basis_apr active (needs 1 perp+spot bar)
    #   t=+5min    funding_current active (needs 1 REST poll)
    #   t=+24h     momentum_1d_reversal active (needs 24 bars)
    #   t=+30 days basis_z_30d / funding_z_30d fully active (rolling z-score window)
    # → first 30 days the strategy runs at ~50% effective weight.
    # See docs/superpowers/specs/2026-05-19-factor-research-lab-design.md
    enabled: true
    config: configs/factor_portfolio.yaml
  # M6+ 新策略（默认 enabled: false，逐个 paper 验证后启用）：
  # - funding_cross_section：多空 funding 横截面，需 universe + β 历史 ≥ 30 天
  # - funding_skew_momentum：funding z-score ±2σ 反向（BTC instance）
  # - stat_arb_pairs：BTC-ETH 协整套利，需 statsmodels（pip install -e ".[stat-arb]"）
  # - option_vol_selling：BTC 短跨式 + delta hedge，需 OPTION instrument loading
  #   （instrument_provider 需要 option_ulys 配置；启用前手动验证）
  # - ml_fusion：XGBoost meta，需 xgboost + 训练好的模型文件
  funding_cross_section:
    enabled: true
    config: configs/strategies/funding_cross_section.yaml
  funding_skew_momentum:
    enabled: true
    config: configs/strategies/funding_skew_momentum.yaml
  stat_arb_pairs:
    # 2026-05-19 启用：statsmodels 0.14.6 已装，走精确 ADF 路径
    # （cointegration p<0.05 才入场，spread z=±2σ 进/-0.5σ 出/±3.5σ 止损）
    enabled: true
    config: configs/strategies/stat_arb_pairs.yaml
  option_vol_selling:
    enabled: false
    config: configs/strategies/option_vol_selling.yaml
  ml_fusion:
    enabled: false
    config: configs/strategies/ml_fusion.yaml
  range_breakout:
    # 2026-05-20 重建并 enable，开始 paper 验证。
    # 2026-05-22 update: 原 7 天窗口走完 2 天 0 fills（低波动期，1H 没有
    # 出现「收破日 K 区间 → 收回区间内」的连续两根模式）。诊断确认策略
    # 加载正常、equity 分配正常，只是入场条件未触发。窗口从 7 天延长到
    # 14 天，新 deadline **2026-06-03**。如仍 0 fills，再考虑放宽阈值
    # 或下线（见 docs/strategy_roadmap.md "重建" 段的 2026-05-22 备注）。
    # 验收标准：
    #   - 真实日 PnL > -$50/天 (truth dashboard)
    #   - 与 xs_momentum 日 PnL 相关系数 < 0.7
    #   - 无 margin leak / pending order 异常 (journal 监控)
    # 任一不达标按 OKX bills 真实数据再次下线。
    enabled: true
    config: configs/strategies/range_breakout.yaml

# 全局风控默认值（策略 yaml 的 risk: 字段会优先生效）
# Kelly / Correlation 默认开：M5 PnL tracker 已接入，足量历史前自动样本不足放行
#
# Kelly 冷启动默认 (0.55, 1.5)：
#   f* = (0.55×1.5 - 0.45) / 1.5 = 0.25 → × kelly_fraction(0.25) = 6.25% 标准仓位
# 不要用 (0.5, 1.0)，那个公式上 = 0，会让所有策略永远 REJECT。
# 前 20 笔成交后 PnL tracker 会调 set_stats 接管。
risk_defaults:
  enable_drawdown: true
  drawdown_daily_pct: 0.03
  drawdown_weekly_pct: 0.08
  enable_kelly: true
  kelly_win_rate: 0.55
  kelly_avg_r: 1.5
  kelly_fraction: 0.25
  enable_correlation: true
  correlation_window: 30
  correlation_threshold: 0.7

# M5.X Regime detector（共享单例，由 monitor 每日喂 BTC 1d candle）
regime:
  impl: rule                # rule | hmm（hmm 需 pip install hmmlearn）
  inst_id: BTC-USDT-SWAP    # 喂 detector 用的 BTC perp 标识
  refresh_interval_s: 86400 # 每日刷新一次
  bootstrap_days: 400       # 启动时 backfill 400 根 1d candle

# Portfolio optimizer：冷启动 equal-weight；30 日数据后切 risk_budget
portfolio_optimizer:
  mode: equal               # equal | risk_budget
  min_history_days: 30
  rebalance_weekday: 1      # 周一（M5 内未实接调度，留 reference）
  rebalance_hour_utc: 0

# Monitor：周期性轮询风控 + 每日 report
monitor:
  poll_interval_s: 60
  daily_report_dir: var/daily_reports

# Alerts：sink 列表 + 触发阈值
alerts:
  sinks:
    - type: log
    - type: jsonl
      path: var/alerts.jsonl
  thresholds:
    kelly_jump: 0.05         # win_rate 跨 5pp → INFO
    correlation_max: 0.7     # 任一对 |ρ| 超 → WARN
    reject_per_hour: 5       # 单策略 1h 内 risk REJECT 超 → WARN

# NT execution engine 配置（reconciliation 在 M6 接通 generate_*_reports 后默认开）
execution:
  reconciliation: true                # 启动时拉 OKX 订单/持仓对账；关掉退化为 stateless
  reconciliation_lookback_mins: 1440  # 历史订单回查窗口（分钟）；null=不限
  # 必须与 OKX 账户 /api/v5/account/config 的 posMode 一致：
  #   posMode=long_short_mode → pos_side_mode: long_short
  #   posMode=net_mode        → pos_side_mode: net
  # 不一致会被 OKX 报 sCode=51000 Parameter posSide error。
  pos_side_mode: long_short
  td_mode: cross                      # cross / isolated；现货自动 fallback 到 cash

# Data loading options
# data:
#   # When option strategies are enabled, restrict option loading to these
#   # underlyings to avoid loading ~500 contracts at startup. Required for
#   # option_vol_selling — set to ["BTC-USD"] (or whatever the strategy uses).
#   option_ulys: ["BTC-USD"]

# OKX 凭证（生产时通过 env 注入；这里留 stub 以便 yaml 自包含）
okx_credentials:
  api_key: null
  api_secret: null
  passphrase: null
  http_proxy: null
